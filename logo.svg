<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Limits logo</title>
  <desc id="description">A dark rounded app tile containing the Limits circle, pearl-gray center, and separate pearl-gray half-torus mark.</desc>

  <defs>
    <linearGradient id="tile" x1="156" y1="128" x2="886" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171719"/>
      <stop offset="0.48" stop-color="#09090a"/>
      <stop offset="1" stop-color="#020203"/>
    </linearGradient>
    <radialGradient id="medallion" cx="0" cy="0" r="1" gradientTransform="translate(400 350) rotate(48) scale(518)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242529"/>
      <stop offset="0.62" stop-color="#111214"/>
      <stop offset="1" stop-color="#080809"/>
    </radialGradient>
    <linearGradient id="pearl" x1="304" y1="244" x2="738" y2="782" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8d7d3"/>
      <stop offset="0.34" stop-color="#bfc0c4"/>
      <stop offset="0.58" stop-color="#d2d1cd"/>
      <stop offset="0.8" stop-color="#b2b4b9"/>
      <stop offset="1" stop-color="#c9c8c4"/>
    </linearGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#tile)"/>
  <circle cx="512" cy="512" r="350" fill="url(#medallion)" stroke="#2a2b2e" stroke-width="3"/>
  <path d="M394 309A235 235 0 0 1 630 716" fill="none" stroke="url(#pearl)" stroke-width="128" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="136" fill="url(#pearl)"/>
</svg>
