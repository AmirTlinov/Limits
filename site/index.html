<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limits for macOS</title>
  <style>
    :root { color-scheme: light dark; font: 17px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(640px, calc(100% - 48px)); }
    h1 { margin: 0 0 8px; font-size: clamp(40px, 8vw, 72px); letter-spacing: -0.05em; }
    p { color: color-mix(in srgb, CanvasText 72%, transparent); }
    a { color: #2787f5; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>Limits</h1>
    <p>A native macOS menu bar app for seeing and switching Codex CLI and Claude Code account limits.</p>
    <p><a href="https://github.com/AmirTlinov/Limits/releases/latest">Download the latest release</a></p>
  </main>
</body>
</html>
