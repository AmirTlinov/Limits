<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Limits logo</title>
  <desc id="description">A minimal black circle with a half-torus limit channel and a solid black center on a transparent background.</desc>

  <defs>
    <mask id="limit-channel" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <path d="M394 309A235 235 0 0 1 630 716" fill="none" stroke="black" stroke-width="128" stroke-linecap="round"/>
    </mask>
  </defs>

  <circle cx="512" cy="512" r="390" fill="#050505" mask="url(#limit-channel)"/>
</svg>
