name: CI

on:
  push:
    branches: [main, codex/limits-v1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install deterministic project generator
        run: |
          gem install xcodeproj -v 1.27.0 --no-document --user-install
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Run deterministic build, hostless tests, UI tests, and isolated runtime
        run: ./script/ci_gate.sh
