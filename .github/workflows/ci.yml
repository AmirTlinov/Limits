name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install deterministic project generator
        run: |
          gem install xcodeproj -v 1.27.0 --no-document --user-install
          USER_GEM_BIN="$(ruby -e 'print Gem.user_dir')/bin"
          export PATH="$USER_GEM_BIN:$PATH"
          echo "$USER_GEM_BIN" >> "$GITHUB_PATH"

      - name: Run deterministic build, hostless tests, UI tests, and isolated runtime
        env:
          LIMITS_ISOLATED_UI_SESSION: "1"
        run: ./script/ci_gate.sh --isolated-ui
