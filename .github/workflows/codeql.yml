name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Resolve the pinned dependency graph
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Limits.xcodeproj \
            -scheme Limits \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          queries: security-extended

      - name: Build the analyzed app
        run: |
          ARCH="$(uname -m)"
          [[ "$ARCH" == "arm64" || "$ARCH" == "x86_64" ]]
          xcodebuild \
            -project Limits.xcodeproj \
            -scheme Limits \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/Limits-CodeQL" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            ARCHS="$ARCH" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
