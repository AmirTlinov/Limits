name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
      LIMITS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      LIMITS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Release tag $TAG does not exist. Create and push the reviewed annotated tag first." >&2
            exit 1
          }
          RELEASE_SHA="$(git rev-list -n 1 "$TAG")"
          git checkout --detach "$RELEASE_SHA"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Install deterministic project generator
        run: |
          gem install xcodeproj -v 1.27.0 --no-document --user-install
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Repeat complete release gate
        run: ./script/ci_gate.sh

      - name: Require signing secrets
        shell: bash
        run: |
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 LIMITS_NOTARY_KEY_ID LIMITS_NOTARY_ISSUER SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub secret for $name" >&2; exit 1; }
          done

      - name: Import Developer ID identity
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/limits-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -p codesigning -v "$KEYCHAIN"

      - name: Prepare notarization key
        shell: bash
        run: |
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${LIMITS_NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          echo "LIMITS_NOTARY_KEY=$NOTARY_KEY" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        run: ./script/package_release.sh "${{ steps.version.outputs.version }}" --notarize

      - name: Fetch current public appcast
        shell: bash
        run: |
          if ! curl --fail --silent --show-error --location \
            https://amirtlinov.github.io/Limits/appcast.xml \
            --output "$RUNNER_TEMP/appcast.xml"; then
            cp site/appcast.xml "$RUNNER_TEMP/appcast.xml"
          fi

      - name: Generate signed appcast
        run: ./script/generate_appcast.sh "${{ steps.version.outputs.version }}" --existing-appcast "$RUNNER_TEMP/appcast.xml"

      - name: Resolve previous signed build for update verification
        id: previous
        shell: bash
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | awk -v current="$CURRENT_TAG" '$0 != current { print; exit }')"
          [[ -n "$PREVIOUS_TAG" ]] || { echo "No previous release tag exists." >&2; exit 1; }
          PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
          mkdir -p "$PREVIOUS_DIR"
          gh release download "$PREVIOUS_TAG" --dir "$PREVIOUS_DIR" --pattern 'Limits-v*-macOS-arm64.zip'
          PREVIOUS_ARCHIVE="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name 'Limits-v*-macOS-arm64.zip' -print -quit)"
          [[ -n "$PREVIOUS_ARCHIVE" ]] || { echo "No signed archive found for $PREVIOUS_TAG." >&2; exit 1; }
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$PREVIOUS_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ASSETS=(
            "dist/Limits-v$VERSION-macOS-arm64.zip"
            "dist/Limits-v$VERSION-macOS-arm64.zip.sha256"
            "dist/appcast.xml"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [[ -f "release-notes/v$VERSION.md" ]]; then
            gh release create "$TAG" "${ASSETS[@]}" --target "${{ steps.version.outputs.release_sha }}" --title "Limits $VERSION" --notes-file "release-notes/v$VERSION.md"
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "${{ steps.version.outputs.release_sha }}" --title "Limits $VERSION" --generate-notes
          fi

      - name: Publish appcast to GitHub Pages
        shell: bash
        run: |
          PAGES="$RUNNER_TEMP/limits-pages"
          git clone --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PAGES"
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_DIR="$PAGES/releases/v$VERSION"
          LATEST_DIR="$PAGES/releases/latest"
          mkdir -p "$VERSION_DIR" "$LATEST_DIR"
          cp site/index.html site/.nojekyll site/favicon.png "$PAGES/"
          mkdir -p "$PAGES/images"
          cp docs/images/limits-window.png docs/images/limits-window-dark.png docs/images/limits-tray.png "$PAGES/images/"
          cp dist/appcast.xml "$PAGES/appcast.xml"
          cp dist/appcast.xml "$VERSION_DIR/appcast.xml"
          cp "dist/Limits-v$VERSION-macOS-arm64.zip" "dist/Limits-v$VERSION-macOS-arm64.zip.sha256" "$VERSION_DIR/"
          if [[ -f "release-notes/v$VERSION.md" ]]; then
            cp "release-notes/v$VERSION.md" "$VERSION_DIR/release-notes.md"
          fi
          rm -rf "$LATEST_DIR"
          mkdir -p "$LATEST_DIR"
          cp "$VERSION_DIR"/* "$LATEST_DIR/"
          cp "dist/Limits-v$VERSION-macOS-arm64.zip" "$LATEST_DIR/Limits-macOS-arm64.zip"
          (
            cd "$LATEST_DIR"
            shasum -a 256 Limits-macOS-arm64.zip > Limits-macOS-arm64.zip.sha256
          )

          cd "$PAGES"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all index.html .nojekyll favicon.png images appcast.xml releases
          if ! git diff --cached --quiet; then
            git commit -m "release: publish Limits ${{ steps.version.outputs.version }} appcast"
            git push origin gh-pages
          fi

      - name: Verify unauthenticated public release receipts
        run: ./script/verify_public_release.sh "${{ steps.version.outputs.version }}"

      - name: Verify Sparkle upgrade from previous signed build
        run: ./script/verify_sparkle_update.sh "${{ steps.version.outputs.version }}" "${{ steps.previous.outputs.archive }}"
