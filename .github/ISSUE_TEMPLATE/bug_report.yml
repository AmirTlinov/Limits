name: Bug report
description: Report reproducible incorrect behavior in Limits.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Limits. Send credential exposure or another security risk through the private vulnerability form in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Limits version or commit
      placeholder: "1.0.0 or 96563e6"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac
      placeholder: "macOS 26.4, Apple M3"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Give the smallest sequence that produces the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add a screenshot or log excerpt only after removing tokens, auth files, account IDs, email addresses, prompts, responses, project paths, and Keychain contents.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private account or session data from this report.
          required: true
